<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Network Telemetry & SLA Validator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        #terminal {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.5;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
        }
        .log-line {
            margin: 4px 0;
            word-wrap: break-word;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #00ff00;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .terminal-input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            width: 80px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
        }
        .terminal-input::-webkit-outer-spin-button,
        .terminal-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .terminal-input[type=number] {
            -moz-appearance: textfield; 
            appearance: none;           
        }

        .color-red { color: #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .color-orange { color: #ff9933; text-shadow: 0 0 5px rgba(255, 153, 51, 0.5); }
        .color-yellow { color: #ffff33; text-shadow: 0 0 5px rgba(255, 255, 51, 0.5); }
        .color-green { color: #00ff00; }
        .color-gray { color: #888888; text-shadow: none; font-size: 12px; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #004400; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff00; }
    </style>
</head>
<body>

    <div id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function removeCursor() {
            const cursor = document.getElementById('cursor');
            if (cursor) cursor.remove();
        }

        function appendCursor(container) {
            removeCursor();
            const cursorSpan = document.createElement('span');
            cursorSpan.id = 'cursor';
            cursorSpan.className = 'cursor';
            container.appendChild(cursorSpan);
        }

        function printLine(text, colorClass = '') {
            const line = document.createElement('div');
            line.className = 'log-line ' + colorClass;
            line.textContent = text;
            terminal.appendChild(line);
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function printTypewriter(text, delay = 20, colorClass = '') {
            const line = document.createElement('div');
            line.className = 'log-line ' + colorClass;
            terminal.appendChild(line);
            
            for (let i = 0; i < text.length; i++) {
                line.textContent += text[i];
                appendCursor(line);
                await sleep(delay);
            }
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function promptInput(promptText) {
            const line = document.createElement('div');
            line.className = 'log-line';
            terminal.appendChild(line);
            
            for (let i = 0; i < promptText.length; i++) {
                line.textContent += promptText[i];
                appendCursor(line);
                await sleep(20);
            }

            const inputField = document.createElement('input');
            inputField.type = 'number';
            inputField.className = 'terminal-input';
            line.appendChild(inputField);
            
            const hintSpan = document.createElement('span');
            hintSpan.className = 'color-gray';
            hintSpan.textContent = ' (Tap here if keyboard not showing)';
            line.appendChild(hintSpan);

            appendCursor(line);
            window.scrollTo(0, document.body.scrollHeight);

            inputField.focus();

            const keepFocus = () => inputField.focus();
            document.body.addEventListener('click', keepFocus);

            return new Promise((resolve) => {
                inputField.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        const val = inputField.value;
                        if (val.trim() !== '') {
                            document.body.removeEventListener('click', keepFocus);
                            inputField.disabled = true;
                            hintSpan.remove(); 
                            removeCursor();
                            resolve(val);
                        }
                    }
                });
            });
        }

        async function measurePingAndJitter() {
            let pings = [];
            for (let i = 0; i < 5; i++) {
                let start = performance.now();
                await new Promise(resolve => {
                    let img = new Image();
                    img.onload = resolve;
                    img.onerror = resolve; 
                    img.src = "https://upload.wikimedia.org/wikipedia/commons/c/ce/Transparent.gif?cb=" + Math.random();
                });
                pings.push(performance.now() - start);
            }
            
            let avgPing = pings.reduce((a, b) => a + b) / pings.length;
            
            let jitter = 0;
            for(let i = 1; i < pings.length; i++) {
                jitter += Math.abs(pings[i] - pings[i-1]);
            }
            jitter = jitter / (pings.length - 1);
            
            return { ping: avgPing, jitter: jitter };
        }

        async function measureUpload() {
            const payloadSize = 2 * 1024 * 1024; 
            const dummyData = new Uint8Array(payloadSize);
            const blob = new Blob([dummyData]);
            const start = performance.now();
            
            try {
                await fetch('https://speed.cloudflare.com/__up', {
                    method: 'POST',
                    body: blob
                });
                const duration = (performance.now() - start) / 1000;
                const speedMbps = (payloadSize * 8 / duration) / 1000000;
                return speedMbps;
            } catch (e) {
                return null; 
            }
        }

        async function runDiagnostics() {
            await printTypewriter('Initializing Advanced Telemetry & SLA Validation Tool...');
            await sleep(500);
            printLine('');

            await printTypewriter('[*] Fetching network topology...');
            await sleep(300);
            
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                await printTypewriter(`[+] IP Address: ${data.ip || 'Unknown'}`);
                await printTypewriter(`[+] ISP/ASN: ${data.org || 'Unknown'} / ${data.asn || 'Unknown'}`);
                await printTypewriter(`[+] Location: ${data.city || 'Unknown'}, ${data.region || 'Unknown'}, ${data.country_name || 'Unknown'}`);
            } catch (e) {
                await printTypewriter('[-] Network topology hidden by client security.', 'color-orange');
            }
            printLine('');

            // INJEKSI URL PARAMETER
            const urlParams = new URLSearchParams(window.location.search);
            const urlDl = parseFloat(urlParams.get('dl'));
            const urlUl = parseFloat(urlParams.get('ul'));

            let expectedDL = 0;
            let expectedUL = 0;

            if (!isNaN(urlDl) && urlDl > 0 && !isNaN(urlUl) && urlUl > 0) {
                expectedDL = urlDl;
                expectedUL = urlUl;
                await printTypewriter(`[*] Target SLA automatically injected via URL Protocol...`, 'color-yellow');
            } else {
                // Fallback kalau link dibuka polosan tanpa parameter
                while (true) {
                    const input = await promptInput('Enter target DOWNLOAD SLA (in Mbps): ');
                    const parsed = parseFloat(input);
                    if (!isNaN(parsed) && parsed > 0) { expectedDL = parsed; break; }
                }
                while (true) {
                    const input = await promptInput('Enter target UPLOAD SLA (in Mbps): ');
                    const parsed = parseFloat(input);
                    if (!isNaN(parsed) && parsed > 0) { expectedUL = parsed; break; }
                }
            }
            
            printLine('');
            await printTypewriter(`[*] Target Locked: ${expectedDL} DL / ${expectedUL} UL Mbps`);
            await sleep(500);
            printLine('');

            await printTypewriter('[*] Executing Micro-Probes (Ping & Jitter)...');
            const { ping, jitter } = await measurePingAndJitter();
            await printTypewriter(`[+] Latency (Ping): ${ping.toFixed(1)} ms`);
            await printTypewriter(`[+] Network Jitter: ${jitter.toFixed(1)} ms`);
            printLine('');

            await printTypewriter('[*] Initiating Download Payload (Ingestion)...');
            const targetURL = `https://upload.wikimedia.org/wikipedia/commons/2/2d/Snake_River_%285mb%29.jpg`;
            const fileSizeBits = 5242880 * 8; 
            const fileSizeMB = 5242880 / (1024 * 1024);
            
            const download = new Image();
            const startDL = performance.now();
            const cacheBuster = "?cb=" + Math.random();
            
            download.onload = async function() {
                const durationSecDL = (performance.now() - startDL) / 1000;
                const speedMbpsDL = (fileSizeBits / durationSecDL) / 1000000;
                const speedMBpsDL = fileSizeMB / durationSecDL;
                
                await printTypewriter(`[+] Download Speed: ${speedMbpsDL.toFixed(2)} Mbps (${speedMBpsDL.toFixed(2)} MB/s)`);
                printLine('');
                
                await printTypewriter('[*] Initiating Upload Payload (Exfiltration)...');
                const speedUL = await measureUpload();
                
                if (speedUL === null) {
                    await printTypewriter(`[-] Upload test blocked by strict client CORS policy.`, 'color-orange');
                } else {
                    const speedMBpsUL = speedUL / 8;
                    await printTypewriter(`[+] Upload Speed: ${speedUL.toFixed(2)} Mbps (${speedMBpsUL.toFixed(2)} MB/s)`);
                }
                
                printLine('');
                await printTypewriter('[*] Analyzing telemetrics...');
                await sleep(500);
                
                const varianceDL = (speedMbpsDL / expectedDL) * 100;
                await printTypewriter(`[*] DL SLA Fulfillment: ${varianceDL.toFixed(2)}%`);
                
                if (varianceDL < 50) {
                    await printTypewriter(`[CRITICAL] Severe Download degradation detected. ISP intervention required.`, 'color-red');
                } else if (varianceDL >= 50 && varianceDL <= 75) {
                    await printTypewriter(`[WARNING] Sub-optimal download performance.`, 'color-orange');
                } else {
                    await printTypewriter(`[OK] Download variance acceptable. Network operating normally.`, 'color-green');
                }
                
                printLine('');
                await printTypewriter('[*] Diagnostic session terminated.');
            };

            download.onerror = async function() {
                await printTypewriter('[-] DOWNLOAD INGESTION FAILED. Connection interrupted.', 'color-red');
            };

            download.src = targetURL + cacheBuster;
        }

        runDiagnostics();
    </script>
</body>
</html>
