<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA Validator Core // Multi-Region & Stress Matrix</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #020202;
            color: #00ff66;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        #terminal {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        .log-line { margin: 4px 0; word-wrap: break-word; }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #00ff66;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .color-red { color: #ff3333; text-shadow: 0 0 8px rgba(255, 51, 51, 0.6); }
        .color-orange { color: #ff9933; text-shadow: 0 0 8px rgba(255, 153, 51, 0.6); }
        .color-yellow { color: #ffff33; text-shadow: 0 0 8px rgba(255, 255, 51, 0.6); }
        .color-green { color: #00ff66; }
        .color-gray { color: #777777; text-shadow: none; font-size: 12px; }
        .color-cyan { color: #00ffff; text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); }
        
        .wa-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background-color: #002200;
            color: #00ff66;
            border: 1px solid #00ff66;
            text-decoration: none;
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
            transition: all 0.2s ease;
        }
        .wa-btn:hover {
            background-color: #00ff66;
            color: #020202;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #003311; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff66; }
    </style>
</head>
<body>

    <div id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        function removeCursor() { const cursor = document.getElementById('cursor'); if (cursor) cursor.remove(); }
        function appendCursor(container) {
            removeCursor();
            const cursorSpan = document.createElement('span');
            cursorSpan.id = 'cursor';
            cursorSpan.className = 'cursor';
            container.appendChild(cursorSpan);
        }
        function printLine(text, colorClass = '') {
            const line = document.createElement('div');
            line.className = 'log-line ' + colorClass;
            line.textContent = text;
            terminal.appendChild(line);
            window.scrollTo(0, document.body.scrollHeight);
        }
        async function printTypewriter(text, delay = 6, colorClass = '') {
            const line = document.createElement('div');
            line.className = 'log-line ' + colorClass;
            terminal.appendChild(line);
            for (let i = 0; i < text.length; i++) {
                line.textContent += text[i];
                appendCursor(line);
                await sleep(delay);
            }
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function measureSinglePing(url) {
            let start = performance.now();
            return new Promise(resolve => {
                let img = new Image();
                let finished = false;
                img.onload = () => { if(!finished) { finished = true; resolve(performance.now() - start); } };
                img.onerror = () => { if(!finished) { finished = true; resolve(null); } }; // null menandakan packet loss/timeout
                img.src = url + "?cb=" + Math.random() + Math.random();
                setTimeout(() => { if(!finished) { finished = true; resolve(null); } }, 2000); // 2s timeout
            });
        }

        async function runPacketLossStressTest() {
            const totalProbes = 20; // Test selama 10 detik (1 probe tiap 500ms)
            let successes = 0;
            let failures = 0;
            let pings = [];

            const testUrl = "https://upload.wikimedia.org/wikipedia/commons/c/ce/Transparent.gif";

            for (let i = 0; i < totalProbes; i++) {
                let p = await measureSinglePing(testUrl);
                if (p !== null) {
                    successes++;
                    pings.push(p);
                } else {
                    failures++;
                }
                await sleep(400);
            }

            let lossPercentage = (failures / totalProbes) * 100;
            let avgPing = pings.length > 0 ? pings.reduce((a, b) => a + b, 0) / pings.length : 999;
            
            let jitter = 0;
            if (pings.length > 1) {
                for(let i = 1; i < pings.length; i++) {
                    jitter += Math.abs(pings[i] - pings[i-1]);
                }
                jitter = jitter / (pings.length - 1);
            }

            return { loss: lossPercentage, ping: avgPing, jitter: jitter, success: successes, total: totalProbes };
        }

        async function runMultiRegionMatrix() {
            // Target multi-region CDN global & lokal
            const regions = [
                { name: "Local / ID Node", url: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Transparent.gif" },
                { name: "Singapore Gateway", url: "https://www.cloudflare.com/favicon.ico" },
                { name: "Tokyo Edge (JP)", url: "https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" }
            ];

            let results = [];
            for (let reg of regions) {
                let latencies = [];
                for (let i = 0; i < 3; i++) {
                    let t = await measureSinglePing(reg.url);
                    if (t !== null) latencies.push(t);
                }
                let avg = latencies.length > 0 ? latencies.reduce((a,b)=>a+b,0)/latencies.length : 999;
                results.push({ name: reg.name, latency: avg });
            }
            return results;
        }

        async function measureUpload() {
            const payloadSize = 2 * 1024 * 1024; 
            const dummyData = new Uint8Array(payloadSize);
            const blob = new Blob([dummyData]);
            const start = performance.now();
            try {
                await fetch('https://speed.cloudflare.com/__up', { method: 'POST', body: blob });
                const duration = (performance.now() - start) / 1000;
                return (payloadSize * 8 / duration) / 1000000;
            } catch (e) { return null; }
        }

        function snapToStandardTier(rawSpeed) {
            const tiers = [10, 20, 30, 50, 75, 100, 150, 200, 300];
            let closest = tiers[0];
            let minDiff = Math.abs(rawSpeed - closest);
            for (let i = 1; i < tiers.length; i++) {
                let diff = Math.abs(rawSpeed - tiers[i]);
                if (diff < minDiff) { minDiff = diff; closest = tiers[i]; }
            }
            return closest;
        }

        async function runDiagnostics() {
            await printTypewriter('Initializing Cyber-Forensic Autonomous Suite v5.0 [STRESS & MATRIX]...');
            await sleep(300);
            printLine('');

            const urlParams = new URLSearchParams(window.location.search);
            const urlDl = parseFloat(urlParams.get('dl'));
            const urlUl = parseFloat(urlParams.get('ul'));
            const serverMode = urlParams.get('mode') || 'global';

            await printTypewriter(`[*] Active Gateway Mode: [ ${serverMode.toUpperCase()} ]`, 'color-cyan');
            await printTypewriter('[*] Intercepting network node descriptors...');
            await sleep(300);
            
            let ispOrg = "Unknown";
            let clientIP = "Unknown";
            let clientLoc = "Unknown";
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                clientIP = data.ip || 'Unknown';
                ispOrg = `${data.org || 'Unknown'} / ${data.asn || 'Unknown'}`;
                clientLoc = `${data.city || 'Unknown'}, ${data.region || 'Unknown'}`;

                await printTypewriter(`[+] Host IP: ${clientIP}`);
                await printTypewriter(`[+] Target ISP: ${ispOrg}`);
                await printTypewriter(`[+] Region Node: ${clientLoc}`);
            } catch (e) {
                await printTypewriter('[-] Topology obfuscated.', 'color-orange');
            }
            printLine('');

            let expectedDL = 0;
            let expectedUL = 0;

            if (!isNaN(urlDl) && urlDl > 0 && !isNaN(urlUl) && urlUl > 0) {
                expectedDL = urlDl;
                expectedUL = urlUl;
                await printTypewriter(`[*] SLA Target Injected: ${expectedDL} DL / ${expectedUL} UL Mbps`, 'color-yellow');
            } else {
                await printTypewriter(`[*] Zero-Config Mode: Running Neural Calibration...`, 'color-yellow');
                const calibrationURL = "https://upload.wikimedia.org/wikipedia/commons/2/2d/Snake_River_%285mb%29.jpg";
                const fileSizeBits = 5242880 * 8;
                const startCalib = performance.now();
                
                await new Promise((resolve) => {
                    let probeImg = new Image();
                    probeImg.onload = resolve;
                    probeImg.onerror = resolve;
                    probeImg.src = calibrationURL + "?cb=" + Math.random();
                });
                
                const calibDuration = (performance.now() - startCalib) / 1000;
                const rawCalibSpeed = (fileSizeBits / calibDuration) / 1000000;
                
                expectedDL = snapToStandardTier(rawCalibSpeed);
                expectedUL = Math.round(expectedDL * 0.5);
                await printTypewriter(`[+] Baseline Locked: ~${rawCalibSpeed.toFixed(2)} Mbps -> Tier: ${expectedDL} Mbps`, 'color-green');
            }
            
            printLine('');
            await printTypewriter(`[*] Threshold Reference: ${expectedDL} DL / ${expectedUL} UL Mbps`);
            await sleep(300);
            printLine('');

            // MODUL 1: MULTI-REGION LATENCY MATRIX
            await printTypewriter('[*] Executing Multi-Region CDN Latency Matrix...');
            let matrixResults = await runMultiRegionMatrix();
            matrixResults.forEach(res => {
                printTypewriter(`    > [ ${res.name} ] -> Latency: ${res.latency === 999 ? 'TIMEOUT' : res.latency.toFixed(1) + ' ms'}`, 5, 'color-cyan');
            });
            printLine('');

            // MODUL 2: 10-SECOND PACKET LOSS STRESS TEST
            await printTypewriter('[*] Executing 10-Second Packet Loss Stress Test (20 Probes)...');
            const stressResult = await runPacketLossStressTest();
            await printTypewriter(`[+] Average Ping (Stress): ${stressResult.ping.toFixed(1)} ms`);
            await printTypewriter(`[+] Signal Jitter: ${stressResult.jitter.toFixed(1)} ms`);
            await printTypewriter(`[+] Packet Loss Ratio: ${stressResult.loss.toFixed(1)}% (${stressResult.failures}/${stressResult.total} dropped)`, stressResult.loss > 0 ? 'color-red' : 'color-green');
            printLine('');

            await printTypewriter('[*] Ingesting High-Density Download Payload...');
            const fileSizeBits = 5242880 * 8; 
            const download = new Image();
            const startDL = performance.now();
            
            download.onload = async function() {
                const durationSecDL = (performance.now() - startDL) / 1000;
                const speedMbpsDL = (fileSizeBits / durationSecDL) / 1000000;
                
                await printTypewriter(`[+] Download Throughput: ${speedMbpsDL.toFixed(2)} Mbps`);
                printLine('');
                
                await printTypewriter('[*] Exfiltrating Test Upload Payload...');
                const speedUL = await measureUpload();
                let speedMbpsUL = speedUL !== null ? speedUL : 0;
                if (speedUL !== null) {
                    await printTypewriter(`[+] Upload Throughput: ${speedMbpsUL.toFixed(2)} Mbps`);
                } else {
                    await printTypewriter(`[-] Upload restricted by policy.`, 'color-orange');
                }
                
                printLine('');
                await printTypewriter('[*] Crunching forensic algorithms...');
                await sleep(400);
                
                const varianceDL = (speedMbpsDL / expectedDL) * 100;
                // Indikator dosa ISP memperhitungkan packet loss juga
                const throttlingScore = Math.max(0, Math.min(100, Math.round((100 - varianceDL) + (stressResult.loss * 2))));
                const ticketId = `#SLA-BRCH-${Math.floor(1000 + Math.random() * 9000)}`;

                await printTypewriter(`[*] SLA Fulfillment Ratio: ${varianceDL.toFixed(2)}%`);
                await printTypewriter(`[*] Calculated Throttling Index: ${throttlingScore} / 100`, throttlingScore > 50 ? 'color-red' : 'color-green');
                printLine('');

                // CYBERPUNK OVERRIDE VERDICT
                await printTypewriter('====================================================', 'color-yellow');
                await printTypewriter(`[SYSTEM OVERRIDE: STRESSED FORENSIC TICKET ${ticketId}]`, 'color-cyan');
                await printTypewriter('====================================================', 'color-yellow');
                
                if (varianceDL < 50 || stressResult.loss > 0) {
                    await printTypewriter(`[CRITICAL BREACH] Anomali & Packet Loss terdeteksi pada jaringan ${ispOrg}!`, 'color-red');
                } else {
                    await printTypewriter(`[STATUS NORMAL] Jalur transmisi stabil tanpa degradasi berarti.`, 'color-green');
                }

                printLine('');
                await printTypewriter('--- GENERATING ADVANCED NOC DISPATCH ---', 'color-gray');
                
                // Rangkuman Matrix Latency untuk teks WA
                let matrixStr = matrixResults.map(r => `${r.name}: ${r.latency === 999 ? 'TIMEOUT' : r.latency.toFixed(1) + 'ms'}`).join(' | ');

                const reportText = `[CYBER-FORENSIC STRESS REPORT // ${ticketId}]\n` +
                                   `• IP Client: ${clientIP}\n` +
                                   `• Node Lokasi: ${clientLoc}\n` +
                                   `• Provider: ${ispOrg}\n` +
                                   `• Mode Gateway: ${serverMode.toUpperCase()}\n` +
                                   `• Target SLA: ${expectedDL} DL / ${expectedUL} UL Mbps\n` +
                                   `• Hasil Aktual: DL ${speedMbpsDL.toFixed(2)} Mbps (${varianceDL.toFixed(2)}%) | UL ${speedMbpsUL.toFixed(2)} Mbps\n` +
                                   `• Stress Packet Loss: ${stressResult.loss.toFixed(1)}% (${stressResult.failures} dropped)\n` +
                                   `• Latency Matrix: [${matrixStr}]\n` +
                                   `• Throttling Index: ${throttlingScore}/100\n` +
                                   `Mohon investigasi dan hapus pembatasan bandwidth serta packet loss pada port saya segera.`;

                await printTypewriter(reportText, 3, 'color-yellow');
                printLine('');

                // Tombol Eksekusi WhatsApp ke nomor uji 085350607184
                const targetWhatsAppNumber = "6285350607184";
                const encodedMessage = encodeURIComponent(reportText);
                const waLink = `https://wa.me/${targetWhatsAppNumber}?text=${encodedMessage}`;

                const btnLine = document.createElement('div');
                btnLine.className = 'log-line';
                btnLine.innerHTML = `[>] EXECUTE DISPATCH: <a href="${waLink}" target="_blank" class="wa-btn">[KIRIM LAPORAN STRESS TEST KE WA: 085350607184]</a>`;
                terminal.appendChild(btnLine);
                
                window.scrollTo(0, document.body.scrollHeight);
                printLine('');
                await printTypewriter('[*] Advanced Stress Diagnostic Session Terminated.');
            };

            download.onerror = async function() {
                await printTypewriter('[-] DATA INGESTION FAILED. Gateway timeout.', 'color-red');
            };

            download.src = "https://upload.wikimedia.org/wikipedia/commons/2/2d/Snake_River_%285mb%29.jpg" + "?cb=" + Math.random();
        }

        runDiagnostics();
    </script>
</body>
</html>
